  #
  #     - name: Deploy to Vercel
  #       id: deploy
  #       uses: amondnet/vercel-action@v25
  #       with:
  #         vercel-token: ${{ secrets.VERCEL_TOKEN }}
  #         vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
  #         vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
  #         vercel-args: '--prod'
  #         working-directory: ./
  #
  #     - name: Comment deployment URL
  #       if: github.event_name == 'push'
  #       uses: actions/github-script@v7
  #       with:
  #         script: |
  #           github.rest.repos.createCommitComment({
  #             owner: context.repo.owner,
  #             repo: context.repo.repo,
  #             commit_sha: context.sha,
  #             body: `✅ Deployed to production: ${{ steps.deploy.outputs.url }}`
  #           })
  #
  # Job 3: Deploy to Vercel (Preview)
  # COMMENTED OUT: Vercel auto-deploys from GitHub, so this job is redundant
  # Uncomment and add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets if manual deployment is needed
  # deploy-vercel-preview:
  #   name: Deploy to Vercel (Preview)
  #   needs: build-and-test
