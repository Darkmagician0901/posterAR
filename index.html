<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Mobile optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XR Poster" />
    
    <!-- Android specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#6366f1" />
    
    <!-- SEO -->
    <meta name="description" content="Place 2D posters in augmented reality using 8th Wall WebAR. Mobile-first AR web application." />
    <meta name="keywords" content="AR, 8th Wall, WebAR, augmented reality, posters, mobile, web app" />
    <meta name="author" content="XR Poster Team" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XR Poster - AR Experience" />
    <meta property="og:description" content="Place 2D posters in augmented reality using 8th Wall WebAR" />
    <meta property="og:url" content="https://xrposter.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XR Poster - AR Experience" />
    <meta name="twitter:description" content="Place 2D posters in augmented reality using 8th Wall WebAR" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    
    <!-- Title -->
    <title>XR Poster - AR Experience</title>
    
    <!-- Prevent zoom on input focus (iOS) -->
    <style>
      input, select, textarea {
        font-size: 16px !important;
      }
    </style>

    <!-- Engine-load diagnostics: record each 8th Wall script's load/error
         outcome and any early runtime error, so the in-app debug panel can show
         WHY the engine didn't start (e.g. blocked script vs. unsupported iOS
         WebAssembly SIMD). Read by src/xr8/pipeline.ts. -->
    <script>
      window.__xr8diag = { engine: 'pending', xrextras: 'pending', landingPage: 'pending', error: null };
      window.addEventListener('error', function (e) {
        var src = (e && e.target && e.target.src) || '';
        if (/8thwall|xr\.js|xrextras|landing-page/i.test(src) ||
            /wasm|webassembly|simd|XR8/i.test(String(e && e.message))) {
          window.__xr8diag.error = String((e && e.message) || ('Failed to load ' + src)).slice(0, 200);
        }
      }, true);
    </script>

    <!-- 8th Wall engine scripts (pinned to 1.0.0 via @1 → latest resolution).
         Load order matters: engine-binary first, then xrextras, then landing-page. -->

    <!-- SRI NOTE for engine-binary: xr.js is a loader that fetches additional
         runtime chunks (slam.js and other split chunks) via dynamic import at
         start-up. An integrity= hash on the loader script does NOT cover those
         fetched chunks, so a static SRI attribute here provides only partial
         protection and could break silently if the chunk manifest changes between
         CDN cache refreshes. Therefore SRI is intentionally omitted for this tag.
         The loader hash for audit purposes is:
         sha384-sH8AXfEATN+EQxSgGL852nRJGeh567wcA55RkkDGgi0cWoE5Zh0Mi8c2bxsLZuya
         Pinned version: @8thwall/engine-binary@1.0.0 -->
    <script
      src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js"
      async
      crossorigin="anonymous"
      data-preload-chunks="slam"
      onload="window.__xr8diag.engine='loaded'"
      onerror="window.__xr8diag.engine='error'"
    ></script>

    <!-- @8thwall/xrextras@1.0.0 — SRI sha384 pinned -->
    <script
      src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js"
      crossorigin="anonymous"
      integrity="sha384-FBP0ovMkbkCCSsc8IUC82onTsdqDZp9bDMSe37690NZnCXlfWk+hlupzHH7AsBVA"
      onload="window.__xr8diag.xrextras='loaded'"
      onerror="window.__xr8diag.xrextras='error'"
    ></script>

    <!-- @8thwall/landing-page@1.0.0 — SRI sha384 pinned -->
    <script
      src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1.0.0/dist/landing-page.js"
      crossorigin="anonymous"
      integrity="sha384-AWtFm2UVSGxj0NlOo0nqxcVGwFopjKDImToiYfi1+T1p8TU6k/89tVAshCJtUW+d"
      onload="window.__xr8diag.landingPage='loaded'"
      onerror="window.__xr8diag.landingPage='error'"
    ></script>
  </head>
  <body>
    <!-- Root element for React -->
    <div id="root"></div>
    
    <!-- Vite module script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Noscript fallback -->
    <noscript>
      <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        background-color: #0f172a;
        color: #f1f5f9;
      ">
        <div>
          <h1>JavaScript Required</h1>
          <p>This application requires JavaScript to be enabled.</p>
          <p>Please enable JavaScript in your browser settings and reload the page.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
