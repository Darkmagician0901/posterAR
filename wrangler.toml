# Cloudflare Pages configuration for XR Poster
# This file is used for Cloudflare Workers/Pages deployment

name = "xr-poster"
compatibility_date = "2024-01-01"

# Pages configuration
pages_build_output_dir = "dist"

[build]
command = "npm run build"

[build.upload]
format = "service-worker"

# Environment variables (set these in Cloudflare dashboard)
[env.production]
name = "xr-poster-production"

[env.preview]
name = "xr-poster-preview"

# Custom domains (configure in Cloudflare dashboard)
# routes = [
#   { pattern = "xr-poster.com", zone_name = "xr-poster.com" }
# ]